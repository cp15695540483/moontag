name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node（js 后端需要）
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit 版本
        run: moon version

      - name: 更新注册表索引
        run: moon update

      - name: 格式检查
        run: moon fmt --check

      - name: 检查（警告即失败）
        run: moon check --target wasm-gc --deny-warn

      - name: 构建
        run: moon build --target wasm-gc

      - name: 测试（wasm-gc）
        run: moon test --target wasm-gc

      - name: 测试（js 后端）
        run: moon test --target js

      # 端到端：用真实工具链生成的音频文件验证读写，
      # 而不是只跑内部单测。
      - name: 安装对拍工具
        run: sudo apt-get update && sudo apt-get install -y ffmpeg flac

      - name: 端到端验证
        run: bash tools/e2e.sh
