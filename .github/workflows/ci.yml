name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node（js 后端需要）
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # 安装 MoonBit。注：官方 CDN 只保留 latest/nightly，钉版本 URL 会 403；
      # 因此用 latest，并在下一步打印版本留痕。若 latest 升级导致失败，
      # 按打印出的版本在本地复现修复。
      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "latest"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit 版本
        run: moon version --all

      - name: 更新注册表索引
        run: moon update

      - name: 格式检查
        run: moon fmt --check

      - name: 检查（警告即失败）
        run: moon check --target wasm-gc --deny-warn

      - name: 构建
        run: moon build --target wasm-gc

      - name: 测试（wasm-gc）
        run: moon test --target wasm-gc

      - name: 测试（js 后端）
        run: moon test --target js

      # 端到端：样本在 tools/samples/ 里已提交，这里只安装读取工具。
      # e2e 只用 ffmpeg 的读取能力，不依赖其编码器配置。
      - name: 安装对拍工具
        run: sudo apt-get update && sudo apt-get install -y ffmpeg flac

      - name: 端到端验证
        run: bash tools/e2e.sh
